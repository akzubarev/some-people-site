name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  master-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Require promotion from develop
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$SOURCE_BRANCH" != develop || "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "Pull requests to master must come from this repository's develop branch."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL regression suite
        run: docker compose -f docker/docker-compose.security-tests.yaml run --build --rm tests
      - name: User migration consistency
        run: docker compose -f docker/docker-compose.security-tests.yaml run --rm tests python manage.py makemigrations users --check --dry-run
      - name: Clean up synthetic test services
        if: always()
        run: docker compose -f docker/docker-compose.security-tests.yaml down --volumes
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        # Legacy Vue CLI's node-ipc metadata predates supported Node releases.
        run: yarn install --frozen-lockfile --non-interactive --ignore-engines
      - name: Typecheck
        run: yarn tsc --noEmit
      - name: Build frontend
        run: yarn build
