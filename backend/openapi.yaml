                - type: string
                - type: array
                  items:
                    type: string
                - type: array
                  items:
                    type: array
                    items:
                      type: string
                nullable: true
            unfilled:
              type: array
              items:
                type: integer
          required:
          - unfilled
          - values
          description: Gets application answers.
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Статус
