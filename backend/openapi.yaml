openapi: 3.0.3
info:
  title: Some People API
  version: '1.0'
paths:
  /api/applications/:
    get:
      operationId: applications_list
      description: Gets list of applications.
      parameters:
      - in: query
        name: game_alias
        schema:
          type: string
      tags:
      - applications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationPrivate'
          description: ''
  /api/applications/{id}/:
    get:
      operationId: applications_retrieve
      description: Gets an application.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Заявка.
        required: true
      tags:
      - applications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPrivate'
          description: ''
  /api/applications/apply/:
    post:
      operationId: applications_apply_create
      description: Creates an application.
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - game_alias
              properties:
                game_alias:
                  type: string
              additionalProperties:
                nullable: true
                oneOf:
                - type: string
                - type: array
                  items:
                    type: string
                - type: array
                  items:
                    type: array
                    items:
                      type: string
              description: 'Partial draft: game_alias and question_<id> answer keys.
                Only questions belonging to the selected game are accepted.'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPrivate'
          description: ''
  /api/applications/delete/:
    post:
      operationId: applications_delete_create
      description: Deletes an application.
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameAliasRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GameAliasRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GameAliasRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
