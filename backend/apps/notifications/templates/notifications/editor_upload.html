{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Изображение для рассылки</title>
  <link rel="stylesheet" href="{% static 'notifications/editor.css' %}">
  <script defer src="{% static 'notifications/editor-upload.js' %}"></script>
</head>
<body class="editor-upload">
  <main>
    <h1>Изображение для рассылки</h1>
    {% if result %}
      {{ result|json_script:'upload-result' }}
      <p id="upload-status" role="status">Изображение загружено.</p>
      <label for="image-url">Ссылка на изображение</label>
      <input id="image-url" readonly value="{{ result.url }}">
    {% else %}
      <p>JPEG, PNG, WebP или GIF, до 5 МБ и 16 мегапикселей. Анимация сохраняется как первый кадр.</p>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Загрузить изображение</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
