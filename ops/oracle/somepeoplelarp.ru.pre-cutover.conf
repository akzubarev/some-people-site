# Staged only. Do not enable until the production cutover is authorized.
server {
    listen 80;
    listen [::]:80;
    server_name somepeoplelarp.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 3600 always;
        return 503;
    }
}
