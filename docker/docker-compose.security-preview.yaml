name: some-people-security-preview
services:
  preview-db:
    image: postgres:15
    environment:
      POSTGRES_DB: security_preview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-preview-only
    volumes:
      - preview_database:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_preview"]
      interval: 2s
      timeout: 5s
      retries: 30
  preview-api:
    build:
      context: ..
      dockerfile: docker/images/security-tests.Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.security_preview_settings
    volumes:
      - ../backend:/app:ro
      - ../backend/media:/preview-media:ro
      - preview_static:/preview-static
    networks: [backend]
    depends_on:
      preview-db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000 --noreload
  preview-web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:1337:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/security-preview.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend/media:/preview-media:ro
      - preview_static:/preview-static:ro
    networks: [frontend, backend]
    depends_on: [preview-api]
networks:
  backend:
    internal: true
  frontend:
volumes:
  preview_database:
  preview_static:
