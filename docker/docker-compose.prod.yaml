name: some-people-prod

networks:
  application:
    driver: bridge

x-backend-base: &backend_base
  image: some-people.prod.backend
  restart: unless-stopped
  build:
    context: ..
    dockerfile: docker/images/backend.prod.Dockerfile
  env_file: ../backend/.env
  networks:
    - application
  volumes:
    - ../runtime/media:/app/media
    - ../runtime/staticfiles:/app/staticfiles
    - ../runtime/logs:/var/log/some-people

services:
  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: ../backend/.env
    networks:
      - application
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    <<: *backend_base
    depends_on:
      postgresql:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The bot is deliberately opt-in. It starts only with --profile bot.
  bot:
    <<: *backend_base
    profiles:
      - bot
    depends_on:
      postgresql:
        condition: service_healthy
    command: ["python", "bot/bot.py"]

  web:
    image: some-people.prod.web
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/images/frontend.prod.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks:
      - application
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../runtime/media:/srv/media:ro
      - ../runtime/staticfiles:/srv/staticfiles:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
